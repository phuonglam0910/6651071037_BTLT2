<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tạo form và các điều khiển</title>

    <style>
        body {
            font-family: Arial;
        }

        form {
            width: 600px;
            margin: 20px auto;
            background-color: #dff5d8;
            padding: 10px;
        }

        h2 {
            color: green;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            border: 1px solid white;
            padding: 5px;
        }

        .cot1 {
            width: 180px;
        }

        #thongbao {
            color: deeppink;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

<form>

    <h2>Phiếu đăng ký tham gia chương trình khuyến mãi</h2>

    <table>

        <tr>
            <td class="cot1">Họ và tên</td>
            <td>
                <input type="text" id="hoten" size="30">
            </td>
        </tr>

        <tr>
            <td>Địa chỉ</td>
            <td>
                <input type="text" id="diachi" size="30">
            </td>
        </tr>

        <tr>
            <td>Điện thoại</td>
            <td>
                <input type="text" id="dienthoai" size="30">
            </td>
        </tr>

        <tr>
            <td>Phái</td>
            <td>
                <input type="radio" name="phai" id="nam" value="Nam">
                Nam

                <input type="radio" name="phai" id="nu" value="Nữ" checked>
                Nữ
            </td>
        </tr>

        <tr>
            <td>Nghề nghiệp</td>
            <td>
                <select id="nghenghiep">
                    <option value="Bác sĩ">Bác sĩ</option>
                    <option value="Kỹ sư">Kỹ sư</option>
                    <option value="Giáo viên">Giáo viên</option>
                    <option value="Khác">Khác</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Chọn sản phẩm tham gia</td>
            <td>
                <select id="sanpham" size="4" multiple>
                    <option value="Kem đánh răng">Kem đánh răng</option>
                    <option value="Bột giặt">Bột giặt</option>
                    <option value="Dầu gội đầu">Dầu gội đầu</option>
                    <option value="Sữa tắm">Sữa tắm</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Số người dự đoán tham gia</td>
            <td>
                <input type="text" id="songuoi" value="250000">
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <input type="button" id="dongy" value="Đồng ý" onclick="dangKy()">
            </td>
        </tr>

        <tr>
            <td colspan="2">
<div id="thongbao"></div>
            </td>
        </tr>

    </table>

</form>

<script>
    function dangKy()
    {
        var thongbao = document.getElementById("thongbao");
        thongbao.innerText = "Bạn đã đăng ký thành công!!!";
    }
</script>

</body>
</html>
